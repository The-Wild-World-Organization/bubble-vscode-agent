name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Gehostete Runner sind in der Org aus. Beide Jobs laufen auf dem eigenen
  # Windows-Runner BUBBLE-WIN (Heimserver), Einrichtung siehe docs/RUNNER.md.
  build:
    runs-on: [self-hosted, windows, bubble-win]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run package script
        run: npm run package

  test:
    runs-on: [self-hosted, windows, bubble-win]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
